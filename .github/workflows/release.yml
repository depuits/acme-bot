name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        run: |
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          GHCR_USERNAME="${{ github.repository_owner }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          
          # Always build dev tag
          TAGS="$DOCKER_USERNAME/$IMAGE_NAME:dev,ghcr.io/$GHCR_USERNAME/$IMAGE_NAME:dev"
          
          # If this is a release, also build latest and version tag
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            TAGS="$TAGS,$DOCKER_USERNAME/$IMAGE_NAME:latest,ghcr.io/$GHCR_USERNAME/$IMAGE_NAME:latest"
            TAGS="$TAGS,$DOCKER_USERNAME/$IMAGE_NAME:$TAG_NAME,ghcr.io/$GHCR_USERNAME/$IMAGE_NAME:$TAG_NAME"
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
